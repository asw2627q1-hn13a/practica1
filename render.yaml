# INF-02: Render Blueprint.
# Desplega l'aplicació com a servei web amb una base de dades PostgreSQL
# gestionada i SEPARADA (Separate Database Pattern): l'app i la BD són serveis
# diferents, connectats només per la variable DATABASE_URL.
# Spec: https://render.com/docs/blueprint-spec
databases:
  - name: hackernews-db
    databaseName: hacker_news_production
    plan: free
    region: frankfurt

services:
  - type: web
    name: hackernews
    runtime: ruby
    plan: free
    region: frankfurt
    # Instal·la gems i precompila els assets durant el build.
    buildCommand: "bundle install && bundle exec rails assets:precompile && bundle exec rails assets:clean"
    # Aplica les migracions i arrenca el servidor a cada desplegament.
    startCommand: "bundle exec rails db:migrate && bundle exec puma -C config/puma.rb"
    envVars:
      # Connexió a la BD separada: Render injecta la cadena de connexió.
      - key: DATABASE_URL
        fromDatabase:
          name: hackernews-db
          property: connectionString
      # Secrets que heu d'omplir manualment al dashboard de Render (sync: false).
      - key: RAILS_MASTER_KEY
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      # Valors fixos.
      - key: RAILS_ENV
        value: production
      - key: RAILS_SERVE_STATIC_FILES
        value: "true"
      - key: RAILS_LOG_TO_STDOUT
        value: "true"
      - key: WEB_CONCURRENCY
        value: "2"
