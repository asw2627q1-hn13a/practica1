          description: Perfil actualitzat, amb la imatge per defecte.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Api-key absent o invàlida.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: L'usuari és un altre que el de l'api-key; no es canvia res.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: L'usuari no existeix o `kind` no és `avatar` ni `banner`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

