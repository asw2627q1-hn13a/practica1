openapi: 3.0.3

info:
  title: Hacker News clone API
  version: 1.0.0
  description: |
    API REST de nivell 2 (Richardson Maturity Model) del clon de Hacker News:
    recursos amb URI pròpia i ús correcte dels verbs i codis d'estat HTTP. Les
    peticions i respostes són JSON. El disseny complet (recursos, URIs, codis
    d'estat i format d'error) és a `docs/api-design.md`.

    Autenticació: TOTES les peticions han de portar la capçalera `X-API-KEY`
    amb l'api-key de l'usuari, que es pot copiar des del seu perfil.

servers:
  - url: https://practica1-65h7.onrender.com
    description: Producció (Render)
  - url: http://localhost:3000
    description: Desenvolupament local

# L'api-key s'aplica a totes les operacions (API-02). Es pot sobreescriure per
# operació si mai calgués, però per defecte tota l'API la requereix.
security:
  - apiKey: []

tags:
  - name: submissions
    description: Enllaços i preguntes (Ask HN).
  - name: comments
    description: Comentaris i respostes.
  - name: votes
    description: Vots sobre submissions i comments.
  - name: favorites
    description: Favorits sobre submissions i comments.
  - name: hidden
    description: Submissions amagades per l'usuari.
  - name: users
    description: Perfils d'usuari i la seva activitat.

# Els paths es completen a mesura que s'implementen els endpoints (DOC-02: cada
# PR d'endpoint hi afegeix el seu path).
paths:
  /api/v1/submissions:
    get:
      tags: [submissions]
      operationId: listSubmissions
      summary: Llista submissions (news/newest/ask) i cerca per títol.
      description: |
        Retorna el llistat news (tipus url, per points), newest (per data, de
        més recent a menys) o ask (només tipus ask). Amb `q` cerca pel títol
        sense distingir majúscules; sense `list`, la cerca es fa sobre totes les
        submissions ordenades per points. Les submissions que l'usuari de
        l'api-key ha amagat queden excloses. Si no hi ha resultats, retorna un
        array buit amb 200.
      parameters:
        - name: list
          in: query
          required: false
          description: Quin llistat tornar (per defecte news).
          schema:
            type: string
            enum: [news, newest, ask]
            default: news
        - name: q
          in: query
          required: false
          description: Paraula a cercar dins del títol (case-insensitive).
          schema:
            type: string
      responses:
        "200":
          description: Llista de submissions (array buit si no n'hi ha cap).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Submission"
        "400":
          description: El paràmetre `list` té un valor no permès.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Api-key absent o invàlida.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      tags: [submissions]
      operationId: createSubmission
      summary: Crea una submission.
      description: |
        Crea una submission de l'usuari de l'api-key (el creador no es llegeix
        mai del cos). Només es llegeixen `title`, `url` i `text`; qualsevol
        altre camp s'ignora. Amb `url` és de tipus `url`; sense (absent, buida,
        només amb espais o `null`) és de tipus `ask` amb `url` a `null`. Es
        comprova primer el format (422) i després si la `url` ja existeix
        (409): en tots dos casos no es crea res.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmissionCreate"
            examples:
              url:
                summary: Submission de tipus url
                value:
                  title: "Show HN: My project"
                  url: "https://github.com/foo/bar"
              ask:
                summary: Submission de tipus ask (sense url)
                value:
                  title: "Ask HN: How do you learn Rails?"
                  text: "Any good resources?"
      responses:
        "201":
          description: Submission creada (sense `comments`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Submission"
        "400":
          description: El cos no és JSON vàlid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Api-key absent o invàlida.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: |
            La `url` ja és d'una altra submission; no es crea res.
            `details.existing_submission_id` és l'id de la que ja la té.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: "`title` absent o buit, o `url` amb format invàlid; `details` té els errors per camp."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/submissions/{id}:
    get:
      tags: [submissions]
      operationId: getSubmission
      summary: Obté una submission amb el seu arbre de comments.
      description: |
        Retorna la submission amb tots els seus comments niats com a arbre: a
        `comments` hi ha els comments directes i cada comment té les seves
        respostes a `replies`, a qualsevol profunditat. A tots els nivells van
        del més antic al més recent (amb la mateixa data, primer l'id més
        petit). També es retorna si l'usuari de l'api-key l'ha amagada.
      parameters:
        - name: id
          in: path
          required: true
          description: Id de la submission.
          schema:
            type: integer
      responses:
        "200":
          description: La submission i el seu arbre de comments (`comments` és un array buit si no en té).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubmissionWithComments"
              examples:
                arbreDeDosNivells:
                  summary: Submission amb un comment que té una resposta i un altre sense respostes
                  value:
                    id: 7
                    title: "Show HN: My project"
                    url: "https://github.com/foo/bar"
                    domain: github.com
                    text: null
                    submission_type: url
                    points: 12
                    comments_count: 3
                    user:
                      id: 2
                      username: alice
                    created_at: "2026-11-20T10:00:00Z"
                    updated_at: "2026-11-20T10:00:00Z"
                    comments:
                      - id: 21
                        body: Great post
                        points: 2
                        user:
                          id: 3
                          username: bob
                        submission_id: 7
                        parent_id: null
                        created_at: "2026-11-20T11:00:00Z"
                        updated_at: "2026-11-20T11:00:00Z"
                        replies:
                          - id: 22
                            body: Thanks!
                            points: 1
                            user:
                              id: 2
                              username: alice
                            submission_id: 7
                            parent_id: 21
                            created_at: "2026-11-20T11:30:00Z"
                            updated_at: "2026-11-20T11:30:00Z"
                            replies: []
                      - id: 23
                        body: How does it compare to X?
                        points: 1
                        user:
                          id: 4
                          username: carol
                        submission_id: 7
                        parent_id: null
                        created_at: "2026-11-20T12:00:00Z"
                        updated_at: "2026-11-20T12:00:00Z"
                        replies: []
        "401":
          description: Api-key absent o invàlida.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: La submission no existeix.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    put:
      tags: [submissions]
      operationId: updateSubmission
      summary: Edita una submission pròpia.
      description: |
        Només el propietari. Actualització parcial: només canvien els camps
        enviats (`title`, `url`, `text`) i qualsevol altre camp s'ignora. Es
        valida com en crear-la. Una `url` buida, només amb espais o `null` es
        desa com a `null`, i el `submission_type` el recalcula el servidor: amb
        `url` és `url` i sense és `ask`. Un cos sense cap camp editable respon
        200 sense canvis.
      parameters:
        - name: id
          in: path
          required: true
          description: Id de la submission.
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmissionUpdate"
      responses:
        "200":
          description: Submission actualitzada (sense `comments`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Submission"
        "400":
          description: El cos no és JSON vàlid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Api-key absent o invàlida.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: La submission és d'un altre usuari; no es canvia res.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: La submission no existeix.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: |
            La nova `url` ja és d'una altra submission; no es canvia res.
            `details.existing_submission_id` és l'id de la que ja la té.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: "`title` buit o `url` amb format invàlid; `details` té els errors per camp."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      tags: [submissions]
      operationId: deleteSubmission
      summary: Esborra una submission pròpia.
      description: |
        Només el propietari. Esborra la submission amb tots els seus comments, a
        qualsevol profunditat, i els vots, favorits i hidden que en depenen.
      parameters:
        - name: id
          in: path
          required: true
          description: Id de la submission.
          schema:
            type: integer
      responses:
        "204":
          description: Esborrada; la resposta no té cos.
        "401":
          description: Api-key absent o invàlida.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: La submission és d'un altre usuari; no s'esborra res.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: La submission no existeix.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/submissions/{submissionId}/comments:
    post:
      tags: [comments]
      operationId: addComment
      summary: Afegeix un comment a una submission.
      description: |
        Crea un comment directe (sense pare) a la submission. L'autor és
        l'usuari de l'api-key; qualsevol camp del cos que no sigui `body`
        s'ignora.
      parameters:
        - name: submissionId
          in: path
          required: true
          description: Id de la submission.
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommentInput"
      responses:
        "201":
          description: Comment creat.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comment"
        "400":
          description: El cos no és JSON vàlid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Api-key absent o invàlida.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: La submission no existeix.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: El `body` falta o és buit (o només té espais).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/comments/{commentId}/replies:
    post:
      tags: [comments]
      operationId: replyToComment
      summary: Respon a un comment de qualsevol profunditat.
      description: |
        Crea una resposta vinculada al comment pare i a la seva submission.
        L'autor és l'usuari de l'api-key; qualsevol camp del cos que no sigui
        `body` s'ignora.
      parameters:
        - name: commentId
          in: path
          required: true
          description: Id del comment pare.
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommentInput"
      responses:
        "201":
          description: Resposta creada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comment"
        "400":
          description: El cos no és JSON vàlid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Api-key absent o invàlida.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: El comment pare no existeix.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: El `body` falta o és buit (o només té espais).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # API-11: un usuari té com a molt un vot per element; l'element i l'api-key
  # identifiquen el vot (no hi ha id de vot). Les respostes porten els points.
  /api/v1/submissions/{submissionId}/votes:
    post:
      tags: [votes]
      operationId: voteSubmission
      summary: Vota una submission d'un altre usuari.
      description: |
        Suma un point a la submission. El votant és l'usuari de l'api-key.
        No es pot votar el contingut propi ni votar dues vegades.
      parameters:
        - name: submissionId
          in: path
          required: true
          description: Id de la submission.
          schema:
            type: integer
      responses:
        "201":
          description: Vot creat. Retorna els points actualitzats.
          content:
            application/json:
              schema:
                type: object
                required: [points]
                properties:
                  points:
                    type: integer
                    example: 13
        "401":
          description: Api-key absent o invàlida.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: La submission és de l'usuari de l'api-key (no es pot votar el contingut propi).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: La submission no existeix.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: L'usuari ja havia votat aquesta submission.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      tags: [votes]
      operationId: unvoteSubmission
      summary: Treu el vot propi d'una submission.
      description: |
        Resta un point a la submission. A diferència de `.../favorites` i
        `.../hidden` (204), respon 200 amb els points actualitzats.
      parameters:
        - name: submissionId
          in: path
          required: true
          description: Id de la submission.
          schema:
            type: integer
      responses:
        "200":
          description: Vot esborrat. Retorna els points actualitzats.
          content:
            application/json:
              schema:
                type: object
                required: [points]
                properties:
                  points:
                    type: integer
                    example: 12
        "401":
          description: Api-key absent o invàlida.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: La submission no existeix o l'usuari no l'havia votada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/comments/{commentId}/votes:
    post:
      tags: [votes]
      operationId: voteComment
      summary: Vota un comment d'un altre usuari.
      description: |
        Suma un point al comment. El votant és l'usuari de l'api-key.
        No es pot votar el contingut propi ni votar dues vegades.
      parameters:
        - name: commentId
          in: path
          required: true
          description: Id del comment.
          schema:
            type: integer
      responses:
        "201":
          description: Vot creat. Retorna els points actualitzats.
          content:
            application/json:
              schema:
                type: object
                required: [points]
                properties:
                  points:
                    type: integer
                    example: 3
        "401":
          description: Api-key absent o invàlida.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: El comment és de l'usuari de l'api-key (no es pot votar el contingut propi).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: El comment no existeix.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: L'usuari ja havia votat aquest comment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      tags: [votes]
      operationId: unvoteComment
      summary: Treu el vot propi d'un comment.
      description: Resta un point al comment i respon 200 amb els points actualitzats.
      parameters:
        - name: commentId
          in: path
          required: true
          description: Id del comment.
          schema:
            type: integer
      responses:
        "200":
          description: Vot esborrat. Retorna els points actualitzats.
          content:
            application/json:
              schema:
                type: object
                required: [points]
                properties:
                  points:
                    type: integer
                    example: 2
        "401":
          description: Api-key absent o invàlida.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: El comment no existeix o l'usuari no l'havia votat.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # API-12: es pot marcar com a favorit qualsevol element, també el propi.
  # Com els vots, l'element i l'api-key identifiquen el favorit.
  /api/v1/submissions/{submissionId}/favorites:
    post:
      tags: [favorites]
      operationId: favoriteSubmission
      summary: Afegeix una submission als favorits.
      description: |
        Afegeix la submission als favorits de l'usuari de l'api-key. Es pot
        marcar també una submission pròpia.
      parameters:
        - name: submissionId
          in: path
          required: true
          description: Id de la submission.
          schema:
            type: integer
      responses:
        "201":
          description: Afegida als favorits.
          content:
            application/json:
              schema:
                type: object
                required: [favorited]
                properties:
                  favorited:
                    type: boolean
                    example: true
        "401":
          description: Api-key absent o invàlida.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: La submission no existeix.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: La submission ja era als favorits de l'usuari.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      tags: [favorites]
      operationId: unfavoriteSubmission
      summary: Treu una submission dels favorits.
      description: Respon 204 sense cos (a diferència de `.../votes`, que retorna els points).
      parameters:
        - name: submissionId
          in: path
          required: true
          description: Id de la submission.
          schema:
            type: integer
      responses:
        "204":
          description: Treta dels favorits.
        "401":
          description: Api-key absent o invàlida.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: La submission no existeix o no era als favorits de l'usuari.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # API-13: amagar és propi de cada usuari i només afecta els llistats.
  /api/v1/submissions/{submissionId}/hidden:
    post:
      tags: [hidden]
      operationId: hideSubmission
      summary: Amaga una submission dels llistats propis.
      description: |
        Amaga la submission per a l'usuari de l'api-key. No afecta els llistats
        d'altres usuaris ni la consulta individual de la submission.
      parameters:
        - name: submissionId
          in: path
          required: true
          description: Id de la submission.
          schema:
            type: integer
      responses:
        "201":
          description: Submission amagada.
          content:
            application/json:
              schema:
                type: object
                required: [hidden]
                properties:
                  hidden:
                    type: boolean
                    example: true
        "401":
          description: Api-key absent o invàlida.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: La submission no existeix.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: La submission ja estava amagada per l'usuari.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      tags: [hidden]
      operationId: unhideSubmission
      summary: Torna a mostrar una submission als llistats propis.
      description: Respon 204 sense cos.
      parameters:
        - name: submissionId
          in: path
          required: true
          description: Id de la submission.
          schema:
            type: integer
      responses:
        "204":
          description: Submission tornada a mostrar.
        "401":
          description: Api-key absent o invàlida.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: La submission no existeix o no estava amagada per l'usuari.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/comments/{commentId}/favorites:
    post:
      tags: [favorites]
      operationId: favoriteComment
      summary: Afegeix un comment als favorits.
      description: |
        Afegeix el comment als favorits de l'usuari de l'api-key. Es pot
        marcar també un comment propi.
      parameters:
        - name: commentId
          in: path
          required: true
          description: Id del comment.
          schema:
            type: integer
      responses:
        "201":
          description: Afegit als favorits.
          content:
            application/json:
              schema:
                type: object
                required: [favorited]
                properties:
                  favorited:
                    type: boolean
                    example: true
        "401":
          description: Api-key absent o invàlida.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: El comment no existeix.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: El comment ja era als favorits de l'usuari.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      tags: [favorites]
      operationId: unfavoriteComment
      summary: Treu un comment dels favorits.
      description: Respon 204 sense cos.
      parameters:
        - name: commentId
          in: path
          required: true
          description: Id del comment.
          schema:
            type: integer
      responses:
        "204":
          description: Tret dels favorits.
        "401":
          description: Api-key absent o invàlida.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: El comment no existeix o no era als favorits de l'usuari.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/comments:
    get:
      tags: [comments]
      operationId: listComments
      summary: Llista els últims comments de tots els usuaris.
      description: |
        Retorna els comments de tots els usuaris, del més recent al més antic,
        en llista plana (sense arbre). Cada comment inclou l'autor, el temps de
        creació, el text i la submission a la qual pertany (`submission`). Si no
        n'hi ha cap, retorna un array buit amb 200.
      responses:
        "200":
          description: Llista de comments (pot ser buida).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Comment"
        "401":
          description: Api-key absent o invàlida.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/comments/{id}:
    get:
      tags: [comments]
      operationId: getComment
      summary: Obté un comment amb el seu subarbre de respostes.
      description: |
        Retorna el comment amb totes les seves respostes niades a `replies`, a
        qualsevol profunditat. Només inclou els seus descendents (ni el comment
        pare ni els germans). A tots els nivells van del més antic al més recent
        (amb la mateixa data, primer l'id més petit). El comment arrel inclou
        també `submission`, la submission a la qual pertany; el comment pare és
        `parent_id` (`null` si és un comment directe a la submission). Les
        respostes no porten `submission`.
      parameters:
        - name: id
          in: path
          required: true
          description: Id del comment.
          schema:
            type: integer
      responses:
        "200":
          description: El comment amb el seu subarbre (`replies` és un array buit si no té respostes).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comment"
              examples:
                subarbreDeDosNivells:
                  summary: Un comment directe amb una resposta
                  value:
                    id: 21
                    body: Great post
                    points: 2
                    user:
                      id: 3
                      username: bob
                    submission_id: 7
                    parent_id: null
                    created_at: "2026-11-20T11:00:00Z"
                    updated_at: "2026-11-20T11:00:00Z"
                    replies:
                      - id: 22
                        body: Thanks!
                        points: 1
                        user:
                          id: 2
                          username: alice
                        submission_id: 7
                        parent_id: 21
                        created_at: "2026-11-20T11:30:00Z"
                        updated_at: "2026-11-20T11:30:00Z"
                        replies: []
                    submission:
                      id: 7
                      title: "Show HN: My project"
        "401":
          description: Api-key absent o invàlida.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: El comment no existeix.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/users/{id}/threads:
    get:
      tags: [users]
      operationId: listUserThreads
      summary: Threads d'un usuari (els seus comments amb les respostes rebudes).
      description: |
        Retorna els comments de l'usuari, del més recent al més antic. Cada
        comment inclou a `replies` les respostes directes que ha rebut, en ordre
        cronològic, i la submission a la qual pertany (`submission`). És públic:
        qualsevol api-key vàlida pot consultar els threads de qualsevol usuari
        (també els de l'usuari de l'api-key). Si l'usuari no té comments,
        retorna un array buit amb 200.
      parameters:
        - name: id
          in: path
          required: true
          description: Id de l'usuari.
          schema:
            type: integer
      responses:
        "200":
          description: Threads de l'usuari (pot ser buida).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Comment"
        "401":
          description: Api-key absent o invàlida.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: L'usuari no existeix.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # API-14: perfil de qualsevol usuari i la seva activitat. Tot és públic (com el
  # perfil de la web): qualsevol api-key vàlida pot consultar qualsevol usuari.
  /api/v1/users/{id}:
    get:
      tags: [users]
      operationId: getUser
      summary: Obté el perfil d'un usuari.
      description: |
        Retorna el perfil de qualsevol usuari. `avatar_url` i `banner_url` són
        URL absolutes: la imatge pujada o, si no n'hi ha, la imatge per defecte.
        L'`email` només s'inclou quan l'usuari és el de l'api-key; l'api-key no
        s'inclou mai.
      parameters:
        - name: id
          in: path
          required: true
          description: Id de l'usuari.
          schema:
            type: integer
      responses:
        "200":
          description: El perfil de l'usuari.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
              examples:
                unAltreUsuari:
                  summary: Perfil d'un altre usuari (sense email)
                  value:
                    id: 3
                    username: bob
                    about: "Rails developer"
                    karma: 42
                    avatar_url: "https://practica1-65h7.onrender.com/rails/active_storage/blobs/redirect/eyJfcmFpbHMi.../avatar.png"
                    banner_url: "https://practica1-65h7.onrender.com/assets/default_banner-1a2b3c4d.png"
                    created_at: "2026-11-01T09:00:00Z"
                elPropi:
                  summary: El perfil propi (amb email)
                  value:
                    id: 2
                    username: alice
                    about: null
                    karma: 25
                    avatar_url: "https://practica1-65h7.onrender.com/assets/default_avatar-7b942fc4.png"
                    banner_url: "https://practica1-65h7.onrender.com/assets/default_banner-1a2b3c4d.png"
                    created_at: "2026-11-01T09:00:00Z"
                    email: alice@example.com
        "401":
          description: Api-key absent o invàlida.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "unauthorized"
                message: "API key is missing or invalid"
        "404":
          description: L'usuari no existeix.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "not_found"
                message: "User with id=999 not found"
    put:
      tags: [users]
      operationId: updateUser
      summary: Edita el perfil propi.
      description: |
        Només el propi perfil (l'usuari de l'api-key). Actualització parcial:
        només canvien els camps enviats (`about`, `email`) i qualsevol altre
        camp (`username`, `api_key`...) s'ignora. Es treuen els espais dels
        extrems, i un valor buit, només amb espais o `null` es desa com a
        `null` (igual que des de la web). Un cos sense cap camp editable respon
        200 sense canvis. Retorna el perfil actualitzat, amb `email`.
      parameters:
        - name: id
          in: path
          required: true
          description: Id de l'usuari (ha de ser el de l'api-key).
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Tots els camps són opcionals; qualsevol altre camp s'ignora.
              properties:
                about:
                  type: string
                  nullable: true
                  example: "Rails developer from Barcelona"
                email:
                  type: string
                  format: email
                  nullable: true
                  example: alice@example.com
      responses:
        "200":
          description: Perfil actualitzat (inclou `email`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
              example:
                id: 2
                username: alice
                about: "Rails developer from Barcelona"
                karma: 25
                avatar_url: "https://practica1-65h7.onrender.com/assets/default_avatar-7b942fc4.png"
                banner_url: "https://practica1-65h7.onrender.com/assets/default_banner-1a2b3c4d.png"
                created_at: "2026-11-01T09:00:00Z"
                email: alice@example.com
        "400":
          description: El cos no és JSON vàlid (només es comprova en el perfil propi).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "bad_request"
                message: "Request body is not valid JSON"
        "401":
          description: Api-key absent o invàlida.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "unauthorized"
                message: "API key is missing or invalid"
        "403":
          description: El perfil és d'un altre usuari; no es canvia res.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "forbidden"
                message: "You can only modify your own profile"
        "404":
          description: L'usuari no existeix.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "not_found"
                message: "User with id=999 not found"
        "422":
          description: "`email` amb format invàlid (un cop trets els espais dels extrems); `details` té l'error; no es canvia res."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "unprocessable_entity"
                message: "Validation failed"
                details:
                  email: ["is invalid"]

  # API-16: imatges del perfil (avatar i banner). L'únic endpoint de l'API que
  # usa multipart/form-data, perquè es pugui provar des de l'editor de Swagger.
  /api/v1/users/{id}/images:
    put:
      tags: [users]
      operationId: uploadUserImages
      summary: Puja un avatar nou, un banner nou o tots dos.
      description: |
        Només el propietari del perfil (l'`{id}` ha de ser l'usuari de
        l'api-key). La petició és `multipart/form-data` amb les parts `avatar`
        i/o `banner` (fitxers); n'hi ha d'haver almenys una. Cada fitxer ha de
        ser una imatge PNG, JPEG, GIF o WebP (es comprova pel contingut, no pel
        nom) de com a màxim 5 MB. Les imatges noves es desen a l'object storage
        extern i substitueixen les anteriors; l'altra imatge, si no s'envia, es
        manté. Si un dels fitxers no és vàlid no es desa cap dels dos.
        Retorna el perfil amb les noves `avatar_url` i `banner_url`.
      parameters:
        - name: id
          in: path
          required: true
          description: Id de l'usuari (el de l'api-key).
          schema:
            type: integer
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                avatar:
                  type: string
                  format: binary
                  description: Avatar nou (PNG, JPEG, GIF o WebP, màxim 5 MB).
                banner:
                  type: string
                  format: binary
                  description: Banner nou (PNG, JPEG, GIF o WebP, màxim 5 MB).
      responses:
        "200":
          description: Perfil actualitzat (amb `email`, que és el perfil propi).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
              example:
                id: 2
                username: alice
                about: null
                karma: 25
                avatar_url: "https://practica1-65h7.onrender.com/rails/active_storage/blobs/redirect/eyJfcmFpbHMi.../avatar.png"
                banner_url: "https://practica1-65h7.onrender.com/rails/active_storage/blobs/redirect/eyJfcmFpbHMi.../default_banner.png"
                created_at: "2026-11-01T09:00:00Z"
                email: alice@example.com
        "400":
          description: No s'ha enviat cap de les parts `avatar` ni `banner`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Api-key absent o invàlida.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: L'usuari és un altre que el de l'api-key; no es canvia res.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: L'usuari no existeix.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: |
            Una part no és un fitxer, o el fitxer no és una imatge PNG, JPEG,
            GIF o WebP, o pesa més de 5 MB. `details` té l'error per camp
            (`avatar` i/o `banner`) i no es desa cap imatge.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "unprocessable_entity"
                message: "Validation failed"
                details:
                  avatar: ["must be a PNG, JPEG, GIF or WebP image"]

  /api/v1/users/{id}/images/{kind}:
    delete:
      tags: [users]
      operationId: resetUserImage
      summary: Torna l'avatar o el banner a la imatge per defecte.
      description: |
        Només el propietari del perfil. Esborra la imatge pujada i en torna a
