        - name: id
          in: path
          required: true
          description: Id de l'usuari de l'api-key.
          schema:
            type: integer
      responses:
        "200":
          description: Submissions votades (pot ser buida).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Submission"
              example:
                - id: 7
                  title: "Show HN: My project"
                  url: "https://github.com/foo/bar"
                  domain: github.com
                  text: null
                  submission_type: url
                  points: 12
                  comments_count: 3
                  user:
                    id: 2
                    username: alice
                  created_at: "2026-11-20T10:00:00Z"
                  updated_at: "2026-11-20T10:00:00Z"
        "401":
          description: Api-key absent o invàlida.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: L'usuari de la ruta no és el de l'api-key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "forbidden"
                message: "You can only see your own upvoted submissions"
        "404":
          description: L'usuari no existeix.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/users/{id}/upvoted/comments:
    get:
      tags: [users]
      operationId: listUserUpvotedComments
      summary: Comments votats per l'usuari de l'api-key.
      description: |
        Llistat privat de comments votats per l'usuari, amb la seva submission.
        `{id}` ha de ser l'usuari de l'api-key; altrament respon 403. Ordenat
        per la data del vot, de més recent a més antic. Unvote (`DELETE
        /api/v1/comments/{comment_id}/votes`) treu l'element del llistat.
      parameters:
        - name: id
          in: path
          required: true
          description: Id de l'usuari de l'api-key.
          schema:
            type: integer
      responses:
        "200":
          description: Comments votats (pot ser buida).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Comment"
              example:
                - id: 22
                  body: Thanks!
                  points: 1
                  user:
                    id: 2
                    username: alice
                  submission_id: 7
                  parent_id: 21
                  created_at: "2026-11-20T11:30:00Z"
                  updated_at: "2026-11-20T11:30:00Z"
                  submission:
                    id: 7
                    title: "Show HN: My project"
        "401":
          description: Api-key absent o invàlida.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: L'usuari de la ruta no és el de l'api-key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "forbidden"
                message: "You can only see your own upvoted comments"
        "404":
          description: L'usuari no existeix.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

components:
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: X-API-KEY
      description: Api-key de l'usuari (del seu perfil). Obligatòria a cada petició.

  schemas:
    UserRef:
      type: object
      description: Referència breu a un usuari, inclosa dins de submissions i comments.
      properties:
        id:
          type: integer
          example: 2
        username:
          type: string
          example: alice

    SubmissionRef:
      type: object
      description: Referència breu a una submission, inclosa als comments dels llistats plans.
      properties:
        id:
          type: integer
          example: 7
        title:
          type: string
          example: "Show HN: My project"

    Submission:
      type: object
      properties:
        id:
          type: integer
          example: 7
        title:
          type: string
          example: "Show HN: My project"
        url:
          type: string
          nullable: true
          example: "https://github.com/foo/bar"
        domain:
          type: string
          nullable: true
          example: github.com
        text:
          type: string
          nullable: true
        submission_type:
          type: string
          enum: [url, ask]
        points:
          type: integer
          example: 12
        comments_count:
          type: integer
          example: 3
        user:
          $ref: "#/components/schemas/UserRef"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    SubmissionWithComments:
      description: Una submission amb el seu arbre de comments (GET /api/v1/submissions/{id}).
      allOf:
        - $ref: "#/components/schemas/Submission"
        - type: object
          properties:
            comments:
              type: array
              description: Comments directes, en ordre cronològic; les respostes són a `replies` de cada comment.
              items:
                $ref: "#/components/schemas/Comment"

    SubmissionUpdate:
      type: object
      description: |
        Cos del PUT d'una submission. Tots els camps són opcionals i només
        canvien els enviats; qualsevol altre camp s'ignora. No serveix per
        crear-la (POST): allà el `title` és obligatori (vegeu SubmissionCreate).
      properties:
        title:
          type: string
          description: No pot ser buit ni només espais.
          example: "Show HN: My project"
        url:
          type: string
          nullable: true
          description: Url http(s). Buida o `null`, la submission és de tipus `ask`.
          example: "https://github.com/foo/bar"
        text:
          type: string
          nullable: true

    SubmissionCreate:
      type: object
      description: |
        Cos del POST d'una submission. Només `title` és obligatori; qualsevol
        camp que no sigui `title`, `url` o `text` s'ignora.
      required: [title]
      properties:
        title:
          type: string
          description: No pot ser buit ni només espais.
          example: "Show HN: My project"
        url:
          type: string
          nullable: true
          description: |
            Url http(s). Absent, buida o `null`, la submission és de tipus
            `ask`. Si ja és d'una altra submission, 409.
          example: "https://github.com/foo/bar"
        text:
          type: string
          nullable: true
          description: Opcional.

    Comment:
      type: object
      properties:
        id:
          type: integer
          example: 21
        body:
          type: string
          example: Great post
        points:
          type: integer
          example: 2
        user:
          $ref: "#/components/schemas/UserRef"
        submission_id:
          type: integer
          example: 7
        parent_id:
          type: integer
          nullable: true
          description: null en un comment directe; id del comment pare en una resposta (COM-05).
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        replies:
          type: array
          description: Només a l'arbre (GET /api/v1/submissions/{id}, GET /api/v1/comments/{id}), en ordre cronològic, i a GET /api/v1/users/{id}/threads (només les respostes directes).
          items:
            $ref: "#/components/schemas/Comment"
        submission:
          description: Només als llistats plans (GET /api/v1/comments, /users/{id}/comments, favorites, upvoted), a GET /api/v1/users/{id}/threads i al comment arrel de GET /api/v1/comments/{id}.
          allOf:
            - $ref: "#/components/schemas/SubmissionRef"

    CommentInput:
      type: object
      description: Cos per crear un comment o una resposta.
      required: [body]
      properties:
        body:
          type: string
          description: Text del comment; no pot ser buit ni només espais.
          example: Great post

    User:
      type: object
      description: |
        Perfil d'usuari (docs/api-design.md §3). Els camps de `required` hi són
        sempre; `email` només per a l'usuari propietari.
      required: [id, username, about, karma, avatar_url, banner_url, created_at]
      properties:
        id:
          type: integer
          example: 2
        username:
          type: string
          example: alice
        about:
          type: string
          nullable: true
          description: "`null` si l'usuari no l'ha omplert."
          example: "Hi!"
        karma:
          type: integer
          example: 25
        avatar_url:
          type: string
          format: uri
        banner_url:
          type: string
          format: uri
        email:
          type: string
          format: email
          nullable: true
          description: Només es retorna a l'usuari propietari. L'api-key no es retorna mai.
        created_at:
          type: string
          format: date-time

    Error:
      type: object
      required: [error, message]
      properties:
        error:
          type: string
          description: Codi estable per a màquines.
          enum:
            - bad_request
            - unauthorized
            - forbidden
            - not_found
            - conflict
            - unprocessable_entity
            - internal_server_error
        message:
          type: string
          example: Validation failed
        details:
          type: object
          nullable: true
          description: "Opcional. 422: errors per camp. 409: existing_submission_id en una url duplicada."
          additionalProperties: true